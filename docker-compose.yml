# Docker Compose >= 2.17 (dockerfile_inline). Keep conf-backend beside conf-frontend.
x-backend: &backend
  image: science-conf-backend:final
  build:
    context: ${BACKEND_CONTEXT:-../conf-backend}
    dockerfile_inline: |
      FROM mcr.microsoft.com/dotnet/sdk:8.0 AS build
      WORKDIR /src
      COPY . .
      WORKDIR /src/ConferencePlatform.Api
      RUN dotnet tool install --tool-path /tools dotnet-ef --version 8.0.26
      RUN dotnet publish -c Release -o /out \
          && /tools/dotnet-ef migrations bundle --configuration Release --output /out/efbundle
      FROM mcr.microsoft.com/dotnet/aspnet:8.0
      RUN apt-get update && apt-get install -y --no-install-recommends curl && rm -rf /var/lib/apt/lists/*
      WORKDIR /app
      COPY --from=build /out .
      ENV ASPNETCORE_URLS=http://+:8080
      EXPOSE 8080
      CMD ["dotnet", "ConferencePlatform.Api.dll"]
  environment:
    ASPNETCORE_ENVIRONMENT: Production
    OrganizerAccount__Email: ${ORGANIZER_EMAIL:-}
    OrganizerAccount__Password: ${ORGANIZER_PASSWORD:-}
    Auth__SigningKey: ${AUTH_SIGNING_KEY:-}
    ConnectionStrings__DefaultConnection: Host=db;Port=5432;Database=science_conf_db;Username=postgres;Password=${POSTGRES_PASSWORD:-conference_local_demo}

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: science_conf_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-conference_local_demo}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d science_conf_db"]
      interval: 5s
      timeout: 5s
      retries: 20
    mem_limit: 256m
    restart: unless-stopped

  migrate:
    <<: *backend
    command: ["./efbundle"]
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 512m
    restart: "no"

  backend:
    <<: *backend
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    mem_limit: 512m
    restart: unless-stopped

  frontend:
    build: .
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    mem_limit: 128m
    restart: unless-stopped

volumes:
  postgres_data:
